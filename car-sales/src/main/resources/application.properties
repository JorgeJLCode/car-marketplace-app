spring.application.name=car-sales
# Configuración de MySQL (con variables de entorno para producción)
# PROD: Definir estas variables en el entorno del servidor (ej. Docker, Heroku, AWS)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carsales_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# IMPORTANTE PROD: Cambiar a 'validate' o 'none' en producción para evitar pérdida de datos accidental
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Local image uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT Configuración (variable de entorno para secreto)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
